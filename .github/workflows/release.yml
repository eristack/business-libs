name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm 12+ needs Node ^22.22.2; track current Node 22 for OIDC publish
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC trusted publishing)
        # Pin major: npm@latest can require a newer Node than the runner has yet
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build publishable packages
        # Only packages/* reach npm; the private site and examples are built by ci.yml.
        run: pnpm exec turbo run build --output-logs=errors-only --filter='./packages/**'

      - name: Pre-publish gate (export map + publish deps)
        # CI runs in parallel on the same push; this is the last check that owns
        # what actually lands on npm: every package.json export resolves to a built
        # dist file and no published package depends on workspace:* at runtime.
        run: pnpm exports:check && pnpm publish:check

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changesets/action writes ~/.npmrc from NPM_TOKEN
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node (registry-url) writes an .npmrc that reads NODE_AUTH_TOKEN;
          # without this, publish looks unauthenticated and npm returns 404
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Agensi pack for the new ai-knowledge release
        # Builds + checks the Agensi upload and attaches it to the GitHub release. Uploading to
        # Agensi itself stays a human-confirmed step (.cursor/skills/agensi-publish): Agensi only
        # accepts the creator's own OAuth agent, one per account, and every submit needs a confirm.
        if: steps.changesets.outputs.published == 'true' && contains(steps.changesets.outputs.publishedPackages, '"@eristack/ai-knowledge"')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/ai/ai-knowledge/package.json').version")
          tag="@eristack/ai-knowledge@${version}"
          if pnpm --filter @eristack/ai-knowledge agensi:release; then
            gh release upload "$tag" \
              packages/ai/ai-knowledge/agensi-dist/eristack-ai-knowledge-pack.zip \
              packages/ai/ai-knowledge/agensi-dist/submission.json --clobber
            {
              echo "### Agensi pack ready — ${tag}"
              echo
              echo "ZIP + submission.json attached to the GitHub release. Nothing was sent to Agensi."
              echo "Publish: in Cursor with the Agensi MCP connected, ask the agent to run the \`agensi-publish\` skill."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Agensi pack not release-ready::${tag} published to npm, but agensi:release failed — see log. Fix (often add packages/ai/ai-knowledge/agensi/changelog/${version}.md) and run the agensi-publish skill."
          fi
