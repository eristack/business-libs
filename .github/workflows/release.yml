name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm 12+ needs Node ^22.22.2; track current Node 22 for OIDC publish
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC trusted publishing)
        # Pin major: npm@latest can require a newer Node than the runner has yet
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changesets/action writes ~/.npmrc from NPM_TOKEN
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node (registry-url) writes an .npmrc that reads NODE_AUTH_TOKEN;
          # without this, publish looks unauthenticated and npm returns 404
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
