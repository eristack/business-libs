skills:
  - name: Money amounts
    slug: money-amounts
    domain: monetary-amounts
    description: Construct Money with strings/minor units, run same-currency arithmetic, compare amounts
    type: core
    packages:
      - '@eristack/money'
    covers:
      - Money.of
      - Money.ofMinor
      - Money.zero
      - Money.fromJSON
      - add / subtract / multiply / divide
      - CurrencyMismatchError
      - NumberValue
    tasks:
      - Create a monetary amount from user or API input
      - Add tax or discount factors without floating-point drift
      - Compare two amounts of the same currency
    failure_modes:
      - mistake: Construct Money from fractional number
        mechanism: Binary float cannot represent many decimals; constructor rejects fractional number
        wrong_pattern: |
          Money.of(19.99, "USD")
        correct_pattern: |
          Money.of("19.99", "USD")
        source: 'packages/money/docs/concepts.md'
        priority: CRITICAL
        status: active
        version_context: 'Agents often default to JS number literals for money'
        skills: ['money-amounts']
      - mistake: Add mixed currencies directly
        mechanism: Same-currency ops throw CurrencyMismatchError; FX must use Conversion
        wrong_pattern: |
          Money.of("10", "USD").add(Money.of("10", "EUR"))
        correct_pattern: |
          usd.with(Conversion.of({ base: "USD", term: "EUR", factor: "0.92" }))
        source: 'packages/money/docs/arithmetic.md'
        priority: HIGH
        status: active
        version_context: ''
        skills: ['money-amounts', 'money-ledger']
      - mistake: Persist intermediate unrounded tax
        mechanism: multiply/divide may promote to decimal path; ledger posts need currency rounding
        wrong_pattern: |
          const tax = line.multiply("0.11")
          await save(tax.toJSON())
        correct_pattern: |
          const tax = line.multiply("0.11").with(Rounding.currencyDefault())
          await save(tax.toJSON())
        source: 'packages/money/docs/rounding.md'
        priority: HIGH
        status: active
        version_context: ''
        skills: ['money-amounts', 'money-ledger']

  - name: Money ledger
    slug: money-ledger
    domain: ledger-operations
    description: Round at ledger boundaries, allocate without losing cents, convert with app-supplied FX, serialize for APIs
    type: core
    packages:
      - '@eristack/money'
    covers:
      - Rounding.currencyDefault
      - Rounding.of
      - allocate / allocateByRatios
      - Conversion.of
      - moneyToJSON / moneyFromJSON
    tasks:
      - Post invoice line totals with currency-default rounding
      - Split a payment across open invoices
      - Convert local currency to reporting currency with a known rate
      - Persist Money as JSON decimal strings
    failure_modes:
      - mistake: Split with plain divide and remainder hacks
        mechanism: Floating division drops cents; allocate uses largest-remainder so parts sum to original
        wrong_pattern: |
          const share = total.divide(3)
        correct_pattern: |
          const [a, b, c] = total.allocate(3)
        source: 'packages/money/docs/allocate.md'
        priority: CRITICAL
        status: active
        version_context: ''
        skills: ['money-ledger']
      - mistake: Expect library to fetch FX rates
        mechanism: Library never bundles market feeds; app must supply factor via Conversion.of
        wrong_pattern: |
          Money.of("100", "USD").convertTo("IDR")
        correct_pattern: |
          Money.of("100", "USD").with(
            Conversion.of({ base: "USD", term: "IDR", factor: "15000" }),
          )
        source: 'packages/money/docs/conversion.md'
        priority: HIGH
        status: active
        version_context: ''
        skills: ['money-ledger']
      - mistake: Serialize amount as JSON number
        mechanism: Wire format requires decimal string to avoid float corruption in transit
        wrong_pattern: |
          { currency: "USD", amount: 19.99 }
        correct_pattern: |
          { currency: "USD", amount: "19.99" }
        source: 'packages/money/docs/serialization.md'
        priority: CRITICAL
        status: active
        version_context: ''
        skills: ['money-ledger']

  - name: JWT auth core
    slug: jwt-auth-core
    domain: jwt-token-lifecycle
    description: Issue/verify/refresh/revoke JWT access + opaque refresh with family reuse detection
    type: core
    packages:
      - '@eristack/jwt-auth'
    covers:
      - createJwtAuth
      - issueTokens
      - verifyAccessToken
      - refresh
      - revoke / revokeAllForSubject
      - RefreshTokenStore
      - RefreshTokenReuseError
    tasks:
      - Issue tokens after app-owned credential verification
      - Rotate refresh tokens safely
      - Revoke one session or all sessions for a subject
    failure_modes:
      - mistake: Put password hashing or login inside jwt-auth core
        mechanism: Core only manages tokens; credentials are app-owned
        wrong_pattern: |
          await auth.login({ email, password })
        correct_pattern: |
          const user = await verifyPassword(email, password)
          await auth.issueTokens({ subject: user.id })
        source: 'packages/jwt-auth/docs/index.md'
        priority: CRITICAL
        status: active
        version_context: ''
        skills: ['jwt-auth-core']
      - mistake: Store refresh tokens in plaintext
        mechanism: Store persists SHA-256 hashes only via RefreshTokenStore
        wrong_pattern: |
          await db.insert(sessions).values({ refreshToken: tokens.refreshToken })
        correct_pattern: |
          createDrizzleRefreshTokenStore({ dialect: "pgsql", db, table })
        source: 'packages/jwt-auth/docs/refresh-flow.md'
        priority: CRITICAL
        status: active
        version_context: ''
        skills: ['jwt-auth-core', 'jwt-auth-adapters']
      - mistake: Ignore refresh reuse errors
        mechanism: Reuse revokes the entire token family
        wrong_pattern: |
          try { await auth.refresh(old) } catch { /* ignore */ }
        correct_pattern: |
          catch (error) {
            if (error instanceof RefreshTokenReuseError) forceReLogin()
          }
        source: 'packages/jwt-auth/docs/refresh-flow.md'
        priority: HIGH
        status: active
        version_context: ''
        skills: ['jwt-auth-core']

  - name: JWT auth adapters
    slug: jwt-auth-adapters
    domain: jwt-adapters
    description: Wire Drizzle dialects and headless REST/Express/Nest/client/React shells
    type: core
    packages:
      - '@eristack/jwt-auth'
    covers:
      - createRefreshTokenTable
      - createDrizzleRefreshTokenStore
      - createRestActions / createRequireAuth
      - createJwtAuthRouter
      - JwtAuthModule / JwtAuthGuard
      - createJwtAuthClient
      - JwtAuthProvider / useJwtAuth
    tasks:
      - Persist refresh tokens with Drizzle pgsql/mysql/sqlite
      - Mount auth routes on Express or Nest
      - Wire headless React auth state
    failure_modes:
      - mistake: Use dialect "pg" instead of "pgsql"
        mechanism: Supported dialect names are pgsql, mysql, sqlite
        wrong_pattern: |
          createRefreshTokenTable("pg")
        correct_pattern: |
          createRefreshTokenTable("pgsql")
        source: 'packages/jwt-auth/src/drizzle/table.ts'
        priority: CRITICAL
        status: active
        version_context: ''
        skills: ['jwt-auth-adapters']
      - mistake: Duplicate refresh handlers in Express
        mechanism: Express/Nest shells call headless /rest actions
        wrong_pattern: |
          app.post("/refresh", async (req, res) => res.json(await auth.refresh(req.body.refreshToken)))
        correct_pattern: |
          app.use("/auth", createJwtAuthRouter({ jwtAuth: auth }))
        source: 'packages/jwt-auth/docs/adapters.md'
        priority: HIGH
        status: active
        version_context: ''
        skills: ['jwt-auth-adapters']
      - mistake: Expect React UI widgets from /react
        mechanism: /react ships provider and hooks only
        wrong_pattern: |
          import { LoginForm } from "@eristack/jwt-auth/react"
        correct_pattern: |
          import { JwtAuthProvider, useJwtAuth } from "@eristack/jwt-auth/react"
        source: 'packages/jwt-auth/docs/adapters.md'
        priority: HIGH
        status: active
        version_context: ''
        skills: ['jwt-auth-adapters']

tensions:
  - name: Precision vs ledger scale
    skills: ['money-amounts', 'money-ledger']
    description: Keep intermediates precise during calculation, but round before persist/display/post
    implication: Agents that round every step accumulate bias; agents that never round write invalid ledger lines
  - name: Core purity vs adapter convenience
    skills: ['jwt-auth-core', 'jwt-auth-adapters']
    description: Token rules live in core; HTTP/DB/UI shells must stay thin
    implication: Agents that put login or SQL into core, or reimplement refresh in Express, drift from the package design

cross_references:
  - from: money-amounts
    to: money-ledger
    reason: Arithmetic creates decimal-scale intermediates that ledger skill rounds and allocates
  - from: money-ledger
    to: money-amounts
    reason: Conversion and allocate assume correctly constructed Money values
  - from: jwt-auth-core
    to: jwt-auth-adapters
    reason: Production store and HTTP/frontend entry points live in adapter exports
  - from: jwt-auth-adapters
    to: jwt-auth-core
    reason: Adapters wrap a shared createJwtAuth instance

gaps:
