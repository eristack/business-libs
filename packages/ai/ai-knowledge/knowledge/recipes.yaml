# Hand-authored feature → package recipes.
# Package/skill ids must exist in the generated catalog (validated by sync + tests).
# Add a recipe when a discoverable product ask should route to @eristack/*.

recipes:
  - id: money-amounts
    title: Prices, tax, discounts, and totals
    priority: 10
    triggers:
      - price
      - prices
      - money
      - currency
      - tax
      - discount
      - discounts
      - markup
      - percent
      - percentage
      - totals
      - subtotal
      - amount
      - amounts
    rationale: >
      Use @eristack/money for immutable currency-safe amounts. Never use JS
      number literals for money — prefer Money.of("19.99", "USD").
    packages:
      - name: "@eristack/money"
        skills:
          - money-amounts
        role: primary

  - id: money-ledger
    title: Invoices, payment splits, FX, and ledger rounding
    priority: 20
    triggers:
      - invoice
      - invoices
      - ledger
      - allocate
      - allocation
      - split
      - splits
      - payment split
      - fx
      - exchange rate
      - multi-currency
      - rounding
      - serialize money
    rationale: >
      Round at ledger boundaries, allocate without losing cents, convert with
      app-supplied FX rates, and serialize amounts as decimal strings. For SQL
      columns and HTTP validation load money-adapters (drizzle.md / rest.md / zod.md).
    packages:
      - name: "@eristack/money"
        skills:
          - money-ledger
          - money-amounts
        role: primary

  - id: money-persist
    title: Store money in SQL and validate API bodies
    priority: 18
    triggers:
      - store money
      - persist money
      - drizzle money
      - money column
      - filter by amount
      - sort price
      - money schema
      - zod money
    rationale: >
      Use @eristack/money/drizzle (docs/drizzle.md) for SQL columns; ./rest or ./zod
      for wire MoneyJSON; ./express or ./nest for HTTP. Hub: docs/adapters.md.
    packages:
      - name: "@eristack/money"
        skills:
          - money-adapters
          - money-ledger
        role: primary

  - id: timestamp-instant
    title: Transaction dates and posted-at times
    priority: 14
    triggers:
      - transaction date
      - transaction_date
      - posted at
      - posted_at
      - occurred at
      - occurred_at
      - business date
      - posting date
    rationale: >
      Use @eristack/timestamp instant mode: UTC instant + IANA timezone for local
      transaction_date labels. Not raw Date or server timezone.
    packages:
      - name: "@eristack/timestamp"
        skills:
          - timestamp-core
        role: primary

  - id: timestamp-wall
    title: Due dates, appointments, and local schedules
    priority: 15
    triggers:
      - due date
      - due_at
      - scheduled
      - scheduled at
      - appointment
      - local midnight
      - dst
      - timezone schedule
    rationale: >
      Use @eristack/timestamp wall mode for local wall-clock intent (DST-safe).
      Convert to UTC only via wallToInstantOnce for single occurrences.
    packages:
      - name: "@eristack/timestamp"
        skills:
          - timestamp-core
        role: primary

  - id: timestamp-persist
    title: Store timestamps in SQL and validate API bodies
    priority: 17
    triggers:
      - store timestamp
      - persist timestamp
      - drizzle timestamp
      - timestamptz
      - posted_at column
      - due_at column
      - timestamp schema
      - zod timestamp
      - parse postedAt
    rationale: >
      Use @eristack/timestamp/drizzle (docs/drizzle.md) for instant/wall SQL columns;
      ./rest or ./zod for TimestampJSON; ./express or ./nest for HTTP. Hub: docs/adapters.md.
    packages:
      - name: "@eristack/timestamp"
        skills:
          - timestamp-adapters
          - timestamp-core
        role: primary

  - id: line-pricing-qups
    title: Line quantity, unit price, discounts, and tax
    priority: 12
    triggers:
      - qups
      - quantity
      - unit price
      - subtotal
      - line total
      - line discount
      - surcharge
      - discount percent
      - goods receipt line
      - order line
      - invoice line
    rationale: >
      Use @eristack/qups calculateLine/patchLine for quantity/unit-price/subtotal
      (exact ratio when UP+S), modifiers, and tax — same math in TanStack Form and
      on the BE. Inject qupsLineColumns (shared currency + *_amount numeric columns)
      into detail tables; withQupsColumns for inserts. See qups stores.md + money
      drizzle.md. Do not invent float qty = subtotal/unitPrice in the UI.
    packages:
      - name: "@eristack/qups"
        skills:
          - qups-core
          - qups-line
          - qups-adapters
        role: primary
      - name: "@eristack/money"
        skills:
          - money-amounts
          - money-ledger
        role: supporting

  - id: jwt-auth-sessions
    title: Login, JWT access, and refresh sessions
    priority: 10
    triggers:
      - login
      - logout
      - auth
      - authentication
      - jwt
      - access token
      - refresh token
      - session
      - sessions
      - password
      - credentials
      - sign in
      - sign-in
    rationale: >
      Use @eristack/jwt-auth for JWT access + opaque refresh with rotation.
      Credentials are a child of your app users table — do not invent a second users model.
    packages:
      - name: "@eristack/jwt-auth"
        skills:
          - jwt-auth-core
        role: primary

  - id: jwt-auth-adapters
    title: Wire auth to Drizzle, HTTP, and React
    priority: 30
    triggers:
      - auth adapter
      - auth express
      - auth nest
      - auth drizzle
      - auth react
      - jwt router
      - require auth
      - auth guard
    rationale: >
      Persist refresh tokens and credentials with Drizzle; expose headless
      REST/Express/Nest/client/React shells. Prefer examples/* patterns.
    packages:
      - name: "@eristack/jwt-auth"
        skills:
          - jwt-auth-adapters
          - jwt-auth-core
        role: primary

  - id: doc-number-sequences
    title: Document and invoice numbers
    priority: 10
    triggers:
      - document number
      - document numbers
      - doc number
      - invoice number
      - invoice numbers
      - sequential number
      - sequence
      - sequences
      - number format
      - period reset
      - yearly reset
    rationale: >
      Use @eristack/doc-number for token patterns ({YYYY}/{SEQ:n}), period
      resets, and atomic sequence allocation.
    packages:
      - name: "@eristack/doc-number"
        skills:
          - doc-number-core
        role: primary

  - id: doc-number-adapters
    title: Persist and configure document-number formats
    priority: 30
    triggers:
      - format store
      - doc number adapter
      - doc number express
      - doc number nest
      - doc number react
      - format crud
    rationale: >
      Drizzle FormatStore/SequenceStore plus REST/Express/Nest/client/React
      format-config shells. App injects db + createDocNumber instance.
    packages:
      - name: "@eristack/doc-number"
        skills:
          - doc-number-adapters
          - doc-number-core
        role: primary

  - id: data-grid-lists
    title: Dynamic list filters, search, sort, and pagination
    priority: 10
    triggers:
      - data grid
      - datagrid
      - table filter
      - table filters
      - list filter
      - advanced filter
      - search string
      - multi sort
      - pagination
      - offset pagination
      - cursor pagination
      - query string filter
    rationale: >
      Use @eristack/data-grid for schema-aware list queries. Prefer advanced
      filters and search mode as separate modes; jwt-auth sessions and
      doc-number formats already return DataGridResult.
    packages:
      - name: "@eristack/data-grid"
        skills:
          - data-grid-core
          - data-grid-adapters
        role: primary

  - id: erp-app-core
    title: ERP-ish app with auth, money, and numbering
    priority: 5
    triggers:
      - erp
      - business app
      - invoicing app
      - billing app
      - commerce backend
      - order management
    rationale: >
      Prefer the Eristack stack first: jwt-auth for sessions, money for amounts,
      doc-number for sequential documents, data-grid for list queries. Load
      core skills before adapters.
    packages:
      - name: "@eristack/jwt-auth"
        skills:
          - jwt-auth-core
          - jwt-auth-adapters
        role: primary
      - name: "@eristack/money"
        skills:
          - money-amounts
          - money-ledger
        role: primary
      - name: "@eristack/doc-number"
        skills:
          - doc-number-core
          - doc-number-adapters
        role: primary
      - name: "@eristack/data-grid"
        skills:
          - data-grid-core
        role: supporting

  - id: epoch-cache-invalidation
    title: Data-version epochs for cache invalidation
    priority: 14
    triggers:
      - cache invalidation
      - stale cache
      - refetch data
      - use cache
      - data version
      - epoch
      - optimistic cache
      - tanstack query invalidate
    rationale: >
      Use @eristack/epoch for headless per-scope version counters: bump after mutations,
      resolveCachePolicy returns use-cache vs refetch for TanStack Query. Drizzle default;
      client/react/express/backseat adapters. Read docs/getting-started.md only.
    packages:
      - name: "@eristack/epoch"
        skills:
          - epoch-core
          - epoch-adapters
        role: primary

  - id: eristack-upgrade
    title: Upgrade @eristack dependencies
    priority: 6
    triggers:
      - upgrade eristack
      - bump eristack
      - update @eristack
      - new version
      - changelog
      - outdated packages
      - what changed
      - migration guide
      - semver peer
    rationale: >
      Consumer upgrades: load @eristack/ai-knowledge#upgrading-eristack and read knowledge/upgrading.md
      only (full Backseat matrix, peers, Changesets). pnpm outdated '@eristack/*', site /{slug}/changelog.
      Do not open per-package docs/backseat.md for upgrade scope.
    packages:
      - name: "@eristack/backseat"
        skills:
          - backseat-core
        role: primary

  - id: backseat-mock-backend
    title: Frontend mock REST backend for prototypes
    priority: 8
    triggers:
      - mock api
      - fake backend
      - frontend backend
      - prototype api
      - storybook api
      - msw alternative
      - json-server browser
      - in-browser api
      - backseat
      - indexeddb api
    rationale: >
      Browser prototypes: load @eristack/ai-knowledge#upgrading-eristack and read knowledge/upgrading.md
      §3 only (full spine matrix, bootstrap, peers). @eristack/backseat engine + eleven ./backseat
      adapters. Optional peer ^0.1.0. Not production — Drizzle + HTTP for real apps.
    packages:
      - name: "@eristack/backseat"
        skills:
          - backseat-core
        role: primary
      - name: "@eristack/jwt-auth"
        skills:
          - jwt-auth-adapters
        role: supporting
      - name: "@eristack/doc-number"
        skills:
          - doc-number-adapters
        role: supporting

  - id: multitab-workspace
    title: Multi-document ERP tab workspace
    priority: 9
    triggers:
      - multitab
      - multi tab
      - document tabs
      - erp tabs
      - tab workspace
      - workspace tabs
      - open in tab
      - browser tabs erp
    rationale: >
      Use @eristack/multitab for headless ERP tab chrome: pathname-keyed route tabs,
      /new/{uuid} placeholders, adjacent insert, localStorage persistence, closeGuard,
      and MultitabRouterProvider for TanStack Router (URL is source of truth). App owns
      tab bar UI and keyboard shortcuts.
    packages:
      - name: "@eristack/multitab"
        skills:
          - multitab-core
        role: primary

  - id: access-control-stack
    title: Roles, attribute limits, and document policies
    priority: 12
    triggers:
      - rbac
      - abac
      - pbac
      - role based
      - roles
      - permissions
      - permission
      - access control
      - authorization
      - can user
      - attribute policy
      - business policy
      - goods receipt limit
      - book value limit
    rationale: >
      Use @eristack/rbac for boolean role permissions, @eristack/abac for
      attribute policies (e.g. max book value), and @eristack/pbac for document
      software policies (e.g. PO outstanding > 0). Pair with jwt-auth for identity.
    packages:
      - name: "@eristack/rbac"
        skills:
          - rbac-core
          - rbac-adapters
        role: primary
      - name: "@eristack/abac"
        skills:
          - abac-core
          - abac-adapters
        role: primary
      - name: "@eristack/pbac"
        skills:
          - pbac-core
          - pbac-adapters
        role: primary
      - name: "@eristack/jwt-auth"
        skills:
          - jwt-auth-core
        role: supporting

  - id: stock-inventory-ledger
    title: Inventory stock movements by location and lot
    priority: 28
    triggers:
      - stock
      - inventory
      - warehouse
      - lot
      - stock movement
      - goods receipt
      - goods issue
      - on hand
    rationale: >
      Use @eristack/stock-movement on @eristack/hash-chained-ledger for qty
      ledgers with composable locations, lots, snapshots, and tamper checks.
    packages:
      - name: "@eristack/stock-movement"
        skills:
          - stock-movement-core
          - stock-movement-adapters
        role: primary
      - name: "@eristack/hash-chained-ledger"
        skills:
          - hash-chained-ledger-core
        role: supporting

  - id: financial-gl-ledger
    title: Financial / GL account ledger
    priority: 29
    triggers:
      - general ledger
      - gl
      - chart of accounts
      - account balance
      - journal entry
      - financial ledger
    rationale: >
      Use @eristack/financial-ledger for accountId+currency hash-chained
      balances with @eristack/money amounts.
    packages:
      - name: "@eristack/financial-ledger"
        skills:
          - financial-ledger-core
          - financial-ledger-adapters
        role: primary
      - name: "@eristack/hash-chained-ledger"
        skills:
          - hash-chained-ledger-core
        role: supporting
      - name: "@eristack/money"
        skills:
          - money-amounts
        role: supporting

  - id: inventory-valuation
    title: FIFO, average, and other inventory valuations
    priority: 30
    triggers:
      - fifo
      - lifo
      - fefo
      - moving average
      - weighted average
      - standard cost
      - inventory valuation
      - costing
      - cost layers
    rationale: >
      Use @eristack/valuations for canon costing methods with qty+value
      hash-chained ledgers.
    packages:
      - name: "@eristack/valuations"
        skills:
          - valuations-core
          - valuations-adapters
        role: primary
      - name: "@eristack/hash-chained-ledger"
        skills:
          - hash-chained-ledger-core
        role: supporting

  - id: erp-modules
    title: ERP modules (PO, SO, product, inventory, finance)
    priority: 6
    triggers:
      - erp
      - enterprise resource planning
      - purchase order
      - sales order
      - goods receipt
      - product master
      - item master
      - procurement
      - order to cash
      - procure to pay
      - inventory transfer
      - stocktake
      - accounts payable
      - accounts receivable
      - work order
      - bill of materials
    rationale: >
      @eristack/feature-* ERP packages are coming soon — full backlog in
      roadmap/erp.md (reprioritize there). Until they ship, compose
      the spine: qups lines, stock-movement, financial-ledger, valuations, pbac,
      doc-number, data-grid, jwt-auth, rbac. Partner/product masters stay app-owned
      until feature-partner and feature-product land.
    packages:
      - name: "@eristack/qups"
        skills:
          - qups-core
          - qups-line
        role: primary
      - name: "@eristack/stock-movement"
        skills:
          - stock-movement-core
        role: primary
      - name: "@eristack/pbac"
        skills:
          - pbac-core
        role: primary
      - name: "@eristack/doc-number"
        skills:
          - doc-number-core
        role: supporting
      - name: "@eristack/financial-ledger"
        skills:
          - financial-ledger-core
        role: supporting
      - name: "@eristack/data-grid"
        skills:
          - data-grid-core
        role: supporting
      - name: "@eristack/jwt-auth"
        skills:
          - jwt-auth-core
        role: supporting

  - id: maintainer-tickets
    title: Bug reports and feature suggestions for maintainers
    priority: 15
    triggers:
      - bug report
      - bug ticket
      - support ticket
      - feature request
      - feature suggestion
      - maintainer ticket
      - fixer upper
      - report a bug
      - suggest a feature
      - eristack ticket
    rationale: >
      Use @eristack/ai-ticket-generator to produce a portable markdown ticket
      (logs/scenario/fix plan or feasibility-gated suggestion) the user can
      send to maintainers for an agent fixer-upper. Every package has ticket.yaml.
    packages:
      - name: "@eristack/ai-ticket-generator"
        skills:
          - ai-ticket-bug
          - ai-ticket-suggest
        role: primary
